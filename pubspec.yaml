name: normativas_app
description: >
  Guía didáctica interactiva de realidad aumentada con inteligencia
  artificial para la enseñanza de normativas de ingeniería de software.
  Trabajo de Integración Curricular — UPEC, Carrera de Computación.

# Impide publicar el paquete en pub.dev por accidente.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # --- Sesión -------------------------------------------------------------
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  google_sign_in: ^7.2.0

  # --- Realidad aumentada -------------------------------------------------
  # Lectura de los marcadores impresos. La pose se calcula a mano a partir
  # de las cuatro esquinas que entrega (ver lib/widgets/ancla_ra.dart).
  mobile_scanner: ^7.4.0

  # --- Voz de la mascota ---------------------------------------------------
  # audioplayers reproduce los clips de assets/voz/, generados de antemano
  # por generar_voces.py. flutter_tts es el respaldo: lee con el motor del
  # teléfono cualquier frase que no tenga clip.
  audioplayers: ^6.8.1
  flutter_tts: ^4.2.3

  # --- Tutor y datos ------------------------------------------------------
  http: ^1.6.0
  shared_preferences: ^2.5.6
  crypto: ^3.0.6

  # --- Hojas imprimibles de marcadores ------------------------------------
  # pdf arma la hoja; printing abre el diálogo de impresión del sistema,
  # desde el que también se guarda como PDF o se comparte.
  pdf: ^3.11.3
  printing: ^5.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Una carpeta incluye todo lo que hay dentro, así que no hace falta
    # listar además los archivos sueltos: mascota_cabeza.png estaba
    # declarado dos veces.
    - assets/img/
    # Los 41 clips de voz más voces.json, que dice cuáles existen.
    - assets/voz/
    # Fuera Frame_1.json y iso_tutor.riv: MascotaESO pasó a dibujar
    # MascotaViva, que son PNG por capas, y Rive no está entre las
    # dependencias. Ninguno de los dos podía leerlo ya nadie.